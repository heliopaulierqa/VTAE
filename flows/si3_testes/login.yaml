# O que este teste prova: com usuario e senha validos, a tela principal abre.
flow: login_si3_apex
# onde estão os elementos
objetos: objects/si3_testes/login.yaml
# onde estão config.yaml e .env
dados: configs/si3_testes/login

steps:
  - esperar: login
  - preencher: { campo: user, valor:  "{dado:usuario}" }
  - preencher: { campo: senha, valor: "{dado:senha}" }
  - clicar: login
  - esperar: login
  - esperar: foco_tela_principal
  - clicar: btn_sair
  - esperar: login