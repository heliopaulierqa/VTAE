sistema: si3_cadastro_paciente_min
tipo: desktop
runner: opencv
ocr_engine: easyocr

ambientes:
  dev:
    url: ''
    confidence: 0.75

credenciais:
  usuario: ${SI3_USER}
  senha:   ${SI3_PASS}

dados_faker:
  - campo: nome
    tipo: faker
    metodo: name
    transformacao: sem_prefixo_upper

  - campo: data_nascimento
    tipo: faker
    metodo: date_of_birth
    transformacao: data_ddmmaaaa

  - campo: data_entrada_brasil
    tipo: faker
    metodo: date_of_birth
    transformacao: data_ddmmaaaa

  - campo: data_naturalizacao
    tipo: faker
    metodo: date_of_birth
    transformacao: data_ddmmaaaa

  # Popup Estrangeiro — o flow antigo chamava o Faker direto no codigo.
  # Dado de teste mora no config, nao no Python (regra 40).
  - campo: estado_estrangeiro
    tipo: faker
    metodo: state_abbr

  - campo: municipio_estrangeiro
    tipo: faker
    metodo: city

  - campo: nr_portaria
    tipo: faker
    metodo: numerify
    args: "####/####"

# ── Dados fixos — listas para selecao aleatoria no flow ─────────────────────
dados:
  # Java Access Bridge — pasta "de mentira" com WindowsAccessBridge-64.dll
  # (lado cliente do pyjab). NAO e o Java real do SI3 nem o JAVA_HOME do
  # sistema. Cada estacao define SI3_JAB_HOME_FAKE no .env; default
  # C:\jab_home. Mesma chave e mesmo default do si3_ambulatorio, que ja
  # roda pyjab validado 3x.
  jab_home_fake: ${SI3_JAB_HOME_FAKE:-C:\jab_home}

  # Cenario de execucao:
  # positivo : dados validos — espera sucesso
  # negativo : dados invalidos — espera deteccao de erro HC-INCOR
  cenario: positivo

  sexo_opcoes:
    - MASCULINO
    - FEMININO

  cor_etnia_opcoes:
    - AMARELA
    - BRANCA
    - PRETA
    - PARDA

  nacionalidade_opcoes:
    - BRASILEIRO
    - ESTRANGEIRO
    - NATURALIZADO

  # ── Popup Brasileiro — pares Estado/Cidade vinculados ────────────────────
  # O flow sorteia o estado e busca a cidade correspondente.
  # Adicionar novos pares sem alterar codigo.
  estados_brasileiro:
    - RO
    - AC
    - AM
    - RR
    - PA
    - AP
    - TO
    - MA
    - PI
    - MT

  cidades_por_estado:
    EX: ESTADO INEXISTENTE
    RO: PORTO VELHO
    AC: RIO BRANCO
    AM: MANAUS
    RR: BOA VISTA
    PA: BELEM
    AP: MACAPA
    TO: PALMAS
    MA: SAO LUIS
    PI: TERESINA
    MT: CUIABA

  # ── Popup Estrangeiro — Pais de Origem ───────────────────────────────────
  # cenario: positivo — valores validos aceitos pelo SI3
  paises_estrangeiro:
    - ARGENTINA
    - CHILE
    - COLOMBIA
    - PARAGUAI
    - PERU
    - URUGUAI
    - BOLIVIA
    - VENEZUELA
    - EQUADOR
    - CUBA

  # cenario: negativo — valor invalido para testar deteccao de erro
  paises_estrangeiro_negativo:
    - XPTO_INVALIDO

  # ── Popup Naturalizado — Pais de Origem ──────────────────────────────────
  # cenario: positivo — Brasil obrigatorio + outros
  paises_naturalizado:
    - BRASIL
    - ARGENTINA
    - CHILE
    - PORTUGAL
    - ITALIA
    - ALEMANHA
    - ESPANHA
    - JAPAO
    - FRANCA
    - ESTADOS UNIDOS

  # cenario: negativo — valor invalido para testar deteccao de erro
  paises_naturalizado_negativo:
    - XPTO_INVALIDO

# ── Locators (coordenadas e regioes OCR) ─────────────────────────────────────
# NAO vivem aqui — fonte unica: objects/cadastro_min.yaml (regra 40).